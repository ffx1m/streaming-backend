name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017/vseries_ci
      JWT_SECRET: ci_jwt_secret_value_with_at_least_32_chars
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci_admin_password_123
      CORS_ORIGINS: http://localhost:3000
      ANALYTICS_TIME_ZONE: Asia/Bangkok

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: npm run check:env

      - name: Run tests
        run: npm test
